services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: ebanx-api-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
    networks:
      - api_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ebanx-api-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - api_net

networks:
  api_net:
    driver: bridge

